<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAVI Мониторинг</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="status-icons">
                <span class="signal">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </span>
                <svg class="wifi-icon" viewBox="0 0 24 24" width="18" height="18">
                    <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1a1a2e"/>
                </svg>
                <svg class="battery-icon" viewBox="0 0 24 24" width="22" height="22">
                    <rect x="2" y="6" width="18" height="12" rx="2" stroke="#1a1a2e" stroke-width="1.5" fill="none"/>
                    <rect x="4" y="8" width="10" height="8" rx="1" fill="#1a1a2e"/>
                    <rect x="20" y="9" width="2" height="6" rx="1" fill="#1a1a2e"/>
                </svg>
            </div>
        </div>

        <div class="content-area">
            {% block content %}{% endblock %}
        </div>

        <div class="bottom-nav">
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Лента</a>
            <a href="/add" class="{% if request.url.path == '/add' %}active{% endif %}">Добавление</a>
            <a href="/grid" class="{% if request.url.path == '/grid' %}active{% endif %}">Плитка</a>
        </div>
    </div>
</body>
</html>

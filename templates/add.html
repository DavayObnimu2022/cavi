{% extends "base.html" %}

{% block content %}
<div class="add-wrapper">
    <div class="add-form">
        <div class="add-header">Добавление</div>

        {% if not service %}
            <!-- ФОРМА СОЗДАНИЯ — название, фото, видео, Далее -->
            <form method="post" action="/add/draft">

                <!-- ФОТО — выбор файла (не сохраняется) -->
                <label class="media-box" for="image-upload"
                       style="display:flex; flex-direction:column; justify-content:center; align-items:center; background:#ffffff; border-radius:14px; padding:20px 14px; width:100%; min-height:100px; text-align:center; border:1px solid #e8ecf1; box-shadow:0 2px 8px rgba(0,0,0,0.04); cursor:pointer; margin-bottom:12px;">
                    <div style="font-size:26px; margin-bottom:6px; color:#4fc3f7;">🖼️</div>
                    <span style="font-weight:500; color:#1a1a2e; font-size:14px;">Изображение</span>
                    <span id="image-name" style="display:block; margin-top:6px; font-size:12px; color:#8e9eab;">Файл не выбран</span>
                    <input type="file" id="image-upload" accept="image/*"
                           style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;"
                           onchange="document.getElementById('image-name').textContent = this.files[0] ? this.files[0].name : 'Файл не выбран';">
                </label>

                <!-- ВИДЕО — выбор файла (не сохраняется) -->
                <label class="media-box" for="video-upload"
                       style="display:flex; flex-direction:column; justify-content:center; align-items:center; background:#ffffff; border-radius:14px; padding:20px 14px; width:100%; min-height:100px; text-align:center; border:1px solid #e8ecf1; box-shadow:0 2px 8px rgba(0,0,0,0.04); cursor:pointer; margin-bottom:20px;">
                    <div style="font-size:26px; margin-bottom:6px; color:#4fc3f7;">🎬</div>
                    <span style="font-weight:500; color:#1a1a2e; font-size:14px;">Видео</span>
                    <span id="video-name" style="display:block; margin-top:6px; font-size:12px; color:#8e9eab;">Файл не выбран</span>
                    <input type="file" id="video-upload" accept="video/*"
                           style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;"
                           onchange="document.getElementById('video-name').textContent = this.files[0] ? this.files[0].name : 'Файл не выбран';">
                </label>

                <!-- НАЗВАНИЕ -->
                <div class="field-group">
                    <label>Название</label>
                    <input type="text" name="title" class="field-input" placeholder="Введите название" required
                           style="display:block; width:100%; background:#ffffff; color:#1a1a2e; font-size:14px; padding:14px 16px; border:1px solid #e8ecf1; border-radius:14px; outline:none; min-height:50px;">
                </div>

                <button type="submit"
                        style="display:block; width:100%; padding:13px 20px; background:#e2e8f0; color:#1a1a2e; border:none; border-radius:28px; font-weight:600; font-size:14px; cursor:pointer; margin-top:10px;">
                    Далее
                </button>
            </form>
        {% else %}
            <!-- ФОРМА ПУБЛИКАЦИИ — фото, видео, описание, 2 поля, Опубликовать -->
            <p style="color:#8e9eab; font-size:14px; text-align:center; margin-bottom:16px;">
                Черновик: {{ service.title }}
            </p>

            <form method="post" action="/add/publish">

                <!-- ФОТО — выбор файла (не сохраняется) -->
                <label class="media-box" for="image-upload-2"
                       style="display:flex; flex-direction:column; justify-content:center; align-items:center; background:#ffffff; border-radius:14px; padding:20px 14px; width:100%; min-height:100px; text-align:center; border:1px solid #e8ecf1; box-shadow:0 2px 8px rgba(0,0,0,0.04); cursor:pointer; margin-bottom:12px;">
                    <div style="font-size:26px; margin-bottom:6px; color:#4fc3f7;">🖼️</div>
                    <span style="font-weight:500; color:#1a1a2e; font-size:14px;">Изображение</span>
                    <span id="image-name-2" style="display:block; margin-top:6px; font-size:12px; color:#8e9eab;">Файл не выбран</span>
                    <input type="file" id="image-upload-2" accept="image/*"
                           style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;"
                           onchange="document.getElementById('image-name-2').textContent = this.files[0] ? this.files[0].name : 'Файл не выбран';">
                </label>

                <!-- ВИДЕО — выбор файла (не сохраняется) -->
                <label class="media-box" for="video-upload-2"
                       style="display:flex; flex-direction:column; justify-content:center; align-items:center; background:#ffffff; border-radius:14px; padding:20px 14px; width:100%; min-height:100px; text-align:center; border:1px solid #e8ecf1; box-shadow:0 2px 8px rgba(0,0,0,0.04); cursor:pointer; margin-bottom:20px;">
                    <div style="font-size:26px; margin-bottom:6px; color:#4fc3f7;">🎬</div>
                    <span style="font-weight:500; color:#1a1a2e; font-size:14px;">Видео</span>
                    <span id="video-name-2" style="display:block; margin-top:6px; font-size:12px; color:#8e9eab;">Файл не выбран</span>
                    <input type="file" id="video-upload-2" accept="video/*"
                           style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;"
                           onchange="document.getElementById('video-name-2').textContent = this.files[0] ? this.files[0].name : 'Файл не выбран';">
                </label>

                <!-- КРАТКОЕ ОПИСАНИЕ -->
                <div class="field-group">
                    <label>Краткое описание</label>
                    <textarea name="description" class="field-textarea" placeholder="Введите описание" required
                              style="display:block; width:100%; background:#ffffff; color:#1a1a2e; font-size:14px; padding:14px 16px; border:1px solid #e8ecf1; border-radius:14px; outline:none; min-height:100px; resize:vertical;">{{ service.description }}</textarea>
                </div>

                <!-- ВОЗРАСТ -->
                <div class="field-group">
                    <label>Возраст</label>
                    <input type="number" name="age" class="field-input" placeholder="Введите возраст"
                           value="{{ service.age or '' }}" required
                           style="display:block; width:100%; background:#ffffff; color:#1a1a2e; font-size:14px; padding:14px 16px; border:1px solid #e8ecf1; border-radius:14px; outline:none; min-height:50px;">
                </div>

                <!-- ДАВЛЕНИЕ -->
                <div class="field-group">
                    <label>Давление</label>
                    <input type="number" name="pressure" class="field-input" placeholder="Введите давление"
                           value="{{ service.pressure or '' }}" required
                           style="display:block; width:100%; background:#ffffff; color:#1a1a2e; font-size:14px; padding:14px 16px; border:1px solid #e8ecf1; border-radius:14px; outline:none; min-height:50px;">
                </div>

                <button type="submit"
                        style="display:block; width:100%; padding:13px 20px; background:#e2e8f0; color:#1a1a2e; border:none; border-radius:28px; font-weight:600; font-size:14px; cursor:pointer; margin-top:10px;">
                    Опубликовать
                </button>
            </form>
        {% endif %}
    </div>
</div>
{% endblock %}

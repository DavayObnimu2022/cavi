{% extends "base.html" %}

{% block content %}
<div class="grid-header">
    <h3>Плитка</h3>
</div>

<div class="filter-row">
    <form method="get" action="/grid" class="filter-form-full">
        <div class="filter-card">
            <div class="filter-labels">
                <span>Возраст: <span id="min-val">{{ filter_age_min }}</span> – <span id="max-val">{{ filter_age_max }}</span></span>
            </div>

            <div class="slider-row">
                <span class="slider-label">От</span>
                <div class="slider-line">
                    <input type="range" name="filter_age_min" min="0" max="100" value="{{ filter_age_min }}"
                           oninput="document.getElementById('min-val').textContent = this.value; document.getElementById('min-val-2').textContent = this.value;">
                </div>
                <span class="slider-value" id="min-val-2">{{ filter_age_min }}</span>
            </div>

            <div class="slider-row">
                <span class="slider-label">До</span>
                <div class="slider-line">
                    <input type="range" name="filter_age_max" min="0" max="100" value="{{ filter_age_max }}"
                           oninput="document.getElementById('max-val').textContent = this.value; document.getElementById('max-val-2').textContent = this.value;">
                </div>
                <span class="slider-value" id="max-val-2">{{ filter_age_max }}</span>
            </div>

            <button type="submit" class="filter-btn">Применить</button>
        </div>
    </form>
</div>

<div class="grid-scroll-area">
    <div class="grid-container">
        {% for item in items %}
            <div class="grid-card-wrapper">
                <a href="/?id={{ item.id }}" class="grid-card-link">
                    <img src="{{ item.image_url }}" alt="{{ item.title }}">
                    <div class="card-info">
                        <h4>{{ item.title }}</h4>
                        <div class="meta">
                            <span>Возраст: {{ item.age }}</span>
                            <span class="likes">❤️ {{ item.likes }}</span>
                        </div>
                    </div>
                </a>
                <form method="post" action="/grid/{{ item.id }}/delete" class="delete-form">
                    <button type="submit" class="delete-btn">Удалить</button>
                </form>
            </div>
        {% else %}
            <p style="color: #8e9eab; grid-column: span 2; text-align: center; padding: 30px 0;">
                Нет услуг
            </p>
        {% endfor %}
    </div>
</div>
{% endblock %}
